name: Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lite.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lite.txt pytest==9.2.0

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:////tmp/secureflow-ci.sqlite
        run: python -m pytest tests -q

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node packages
        run: npm ci

      - name: Lint and build frontend assets
        env:
          VITE_API_URL: /api/v1
        run: |
          npm run lint
          npm run build

      - name: Install browser for UI checks
        run: npx playwright-core install --with-deps chromium

      - name: Run frontend browser checks
        run: npm test
